services:
  pebble-web:
    build: .
    ports:
      - "${PEBBLE_PORT:-8080}:8080"
    volumes:
      - pebble-data:/data
    environment:
      - PEBBLE_PASSWORD=${PEBBLE_PASSWORD:?Set PEBBLE_PASSWORD in .env}
      - PEBBLE_JWT_SECRET=${PEBBLE_JWT_SECRET:?Set PEBBLE_JWT_SECRET in .env}
      - PEBBLE_DATA_DIR=/data
      - PEBBLE_PORT=8080
      - PEBBLE_SYNC_INTERVAL=${PEBBLE_SYNC_INTERVAL:-300}
      - PEBBLE_PUBLIC_URL=${PEBBLE_PUBLIC_URL:-http://localhost:8080}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
    restart: unless-stopped

volumes:
  pebble-data:
