services:
  pebble-web:
    build: .
    ports:
      - "${PEBBLE_PORT:-8080}:8080"
    volumes:
      - pebble-data:/data
    environment:
      - PEBBLE_PASSWORD=${PEBBLE_PASSWORD:?Set PEBBLE_PASSWORD in .env}
      - PEBBLE_JWT_SECRET=${PEBBLE_JWT_SECRET:?Set PEBBLE_JWT_SECRET in .env}
      - PEBBLE_DATA_DIR=/data
      - PEBBLE_PORT=8080
      - PEBBLE_REALTIME_PREFERENCE=${PEBBLE_REALTIME_PREFERENCE:-balanced}
      - PEBBLE_PUBLIC_BASE_URL=${PEBBLE_PUBLIC_BASE_URL:-}
      - PEBBLE_GOOGLE_CLIENT_ID=${PEBBLE_GOOGLE_CLIENT_ID:-}
      - PEBBLE_GOOGLE_CLIENT_SECRET=${PEBBLE_GOOGLE_CLIENT_SECRET:-}
      - PEBBLE_MICROSOFT_CLIENT_ID=${PEBBLE_MICROSOFT_CLIENT_ID:-}
      - PEBBLE_MICROSOFT_CLIENT_SECRET=${PEBBLE_MICROSOFT_CLIENT_SECRET:-}
    restart: unless-stopped

volumes:
  pebble-data:
